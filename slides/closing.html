<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Cierre</title>
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;background:var(--surface-page)}
.slide{width:1280px;height:720px;position:relative;overflow:hidden;font-family:var(--font-brand);background:var(--cmf-white)}
.slide h1,.slide h2,.slide h3{font-family:var(--font-brand);letter-spacing:0}
.eyebrow{font-size:16px;font-weight:700;letter-spacing:var(--ls-caps);text-transform:uppercase}
.rule{height:5px;width:72px;background:var(--color-brand);border:0;border-radius:999px;margin:0}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
</style></head><body>
<section class="slide" data-screen-label="06" style="background:var(--cmf-navy)">
  <span style="position:absolute;bottom:-260px;left:-180px;width:820px;height:520px;background:var(--cmf-indigo);transform:rotate(-38deg);display:block"></span>
  <span style="position:absolute;bottom:-300px;left:180px;width:700px;height:460px;background:var(--cmf-teal-deep);transform:rotate(-38deg);display:block"></span>
  <div style="position:absolute;left:88px;right:200px;top:130px">
    <hr class="rule" style="background:var(--cmf-teal-200);margin-bottom:34px">
    <p style="color:#fff;font-size:40px;line-height:1.3;margin:0 0 30px;font-weight:700">“Regulamos y supervisamos a las instituciones financieras para proteger a los usuarios y resguardar la fe pública.”</p>
    <p style="color:var(--cmf-teal-200);font-size:20px;margin:0;letter-spacing:var(--ls-wide)">Comisión para el Mercado Financiero</p>
  </div>
  <div style="position:absolute;left:88px;right:88px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end">
    <img src="../assets/logos/logo-cmf-blanco.svg" alt="Comisión para el Mercado Financiero" style="height:56px">
    <div style="text-align:right;color:rgba(255,255,255,.86);font-size:19px;line-height:1.6">
      <div style="font-weight:700;color:#fff">www.cmfchile.cl</div>
      <div>600 831 0000 · Santiago de Chile</div>
    </div>
  </div>
</section>
</body></html>
