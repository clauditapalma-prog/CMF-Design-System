<!-- @dsCard group="Diapositivas" viewport="1280x720" name="Cifras destacadas (KPI)" subtitle="Tres cifras grandes sobre grilla clara, con nota de fuente" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Cifras destacadas</title>
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;background:var(--surface-page)}
.slide{width:1280px;height:720px;position:relative;overflow:hidden;font-family:var(--font-brand);background:var(--cmf-white)}
.slide h1,.slide h2,.slide h3{font-family:var(--font-brand);letter-spacing:0}
.eyebrow{font-size:16px;font-weight:700;letter-spacing:var(--ls-caps);text-transform:uppercase}
.rule{height:5px;width:72px;background:var(--color-brand);border:0;border-radius:999px;margin:0}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
</style></head><body>
<section class="slide" data-screen-label="05" style="background:var(--cmf-ink-50)">
  <div style="position:absolute;left:88px;top:80px;right:88px">
    <span class="eyebrow" style="color:var(--color-brand)">Sistema financiero · febrero 2026</span>
    <h2 style="font-size:40px;margin:14px 0 8px;color:var(--text-strong);font-weight:700">El mercado en cifras</h2>
    <hr class="rule" style="margin-bottom:52px">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
      <div style="background:#fff;border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);padding:36px 32px;position:relative;overflow:hidden">
        <span style="position:absolute;top:0;left:0;right:0;height:5px;background:var(--color-brand);display:block"></span>
        <span style="display:block;font-size:76px;line-height:1;font-weight:700;color:var(--color-brand)">1.247</span>
        <p style="margin:16px 0 0;font-size:20px;color:var(--text-body);line-height:1.35">entidades fiscalizadas</p>
      </div>
      <div style="background:#fff;border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);padding:36px 32px;position:relative;overflow:hidden">
        <span style="position:absolute;top:0;left:0;right:0;height:5px;background:var(--cmf-teal);display:block"></span>
        <span style="display:block;font-size:76px;line-height:1;font-weight:700;color:var(--cmf-teal-deep)">15,6 %</span>
        <p style="margin:16px 0 0;font-size:20px;color:var(--text-body);line-height:1.35">índice de adecuación de capital</p>
      </div>
      <div style="background:#fff;border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);padding:36px 32px;position:relative;overflow:hidden">
        <span style="position:absolute;top:0;left:0;right:0;height:5px;background:var(--cmf-navy);display:block"></span>
        <span style="display:block;font-size:76px;line-height:1;font-weight:700;color:var(--cmf-navy)">38.402</span>
        <p style="margin:16px 0 0;font-size:20px;color:var(--text-body);line-height:1.35">reclamos atendidos en el año</p>
      </div>
    </div>
    <p style="margin:44px 0 0;font-size:16px;color:var(--text-faint)">Cifras de ejemplo para efectos de plantilla. Fuente: elaboración propia.</p>
  </div>
  <img src="../assets/logos/logo-CMF-gris-horizontal.png" alt="CMF" style="position:absolute;right:88px;bottom:44px;height:36px">
</section>
</body></html>
