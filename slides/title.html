<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Portada</title>
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;background:var(--surface-page)}
.slide{width:1280px;height:720px;position:relative;overflow:hidden;font-family:var(--font-brand);background:var(--cmf-white)}
.slide h1,.slide h2,.slide h3{font-family:var(--font-brand);letter-spacing:0}
.eyebrow{font-size:16px;font-weight:700;letter-spacing:var(--ls-caps);text-transform:uppercase}
.rule{height:5px;width:72px;background:var(--color-brand);border:0;border-radius:999px;margin:0}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
</style></head><body>
<section class="slide" data-screen-label="02" style="background:var(--cmf-navy)">
  <span style="position:absolute;top:-180px;right:-120px;width:760px;height:520px;background:var(--cmf-indigo);transform:rotate(-38deg);display:block"></span>
  <span style="position:absolute;bottom:-240px;right:120px;width:700px;height:480px;background:var(--cmf-teal);transform:rotate(-38deg);display:block"></span>
  <span style="position:absolute;bottom:-80px;right:-80px;width:400px;height:320px;background:var(--cmf-teal-deep);transform:rotate(-38deg);display:block"></span>
  <span style="position:absolute;top:-40px;bottom:-40px;right:150px;width:12px;background:var(--color-brand);transform:rotate(-38deg);display:block"></span>
  <div style="position:absolute;left:88px;top:150px;right:620px">
    <img src="../assets/logos/logo-cmf-blanco.svg" alt="Comisión para el Mercado Financiero" style="height:70px;display:block;margin-bottom:40px">
    <h1 style="color:#fff;font-size:56px;line-height:1.1;margin:0 0 22px;font-weight:700">Un mercado financiero seguro, transparente y estable</h1>
    <p style="color:var(--cmf-teal-200);font-size:22px;margin:0;font-weight:700;letter-spacing:var(--ls-wide)">Cuenta pública 2026</p>
  </div>
</section>
</body></html>
