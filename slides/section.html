<!-- @dsCard group="Diapositivas" viewport="1280x720" name="Separador de sección" subtitle="Corte de sección: número grande, título y motivo diagonal" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Separador de sección</title>
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;background:var(--surface-page)}
.slide{width:1280px;height:720px;position:relative;overflow:hidden;font-family:var(--font-brand);background:var(--cmf-white)}
.slide h1,.slide h2,.slide h3{font-family:var(--font-brand);letter-spacing:0}
.eyebrow{font-size:16px;font-weight:700;letter-spacing:var(--ls-caps);text-transform:uppercase}
.rule{height:5px;width:72px;background:var(--color-brand);border:0;border-radius:999px;margin:0}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
</style></head><body>
<section class="slide" data-screen-label="03" style="background:var(--cmf-navy)">
  <span style="position:absolute;top:-200px;left:-160px;width:820px;height:560px;background:var(--cmf-indigo);transform:rotate(-38deg);display:block"></span>
  <span style="position:absolute;bottom:-260px;left:60px;width:720px;height:500px;background:var(--color-brand);transform:rotate(-38deg);display:block"></span>
  <div style="position:absolute;right:96px;top:230px;text-align:right">
    <span style="display:block;font-size:150px;line-height:1;font-weight:700;color:var(--cmf-teal)">02</span>
    <hr class="rule" style="background:var(--cmf-teal-200);margin:26px 0 26px auto">
    <h2 style="color:#fff;font-size:46px;margin:0;font-weight:700">Supervisión de bancos<br>e instituciones financieras</h2>
  </div>
</section>
</body></html>
