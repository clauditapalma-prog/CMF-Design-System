<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Contenido oficial 2026</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--surface-page)}
.slide{width:1280px;height:720px;position:relative;overflow:hidden;font-family:var(--font-brand);background-size:cover;background-position:center}
.slide h1,.slide h2,.slide h3{font-family:var(--font-brand);letter-spacing:0}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:var(--ls-caps);text-transform:uppercase}
.rule{height:5px;width:72px;border:0;border-radius:999px;margin:0}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style></head><body>
<section class="slide" data-screen-label="02" style="background-image:url('../assets/backgrounds/cmf-fondo-claro-2026.jpg')">
  <div style="position:absolute;left:96px;top:300px;right:200px">
    <span class="eyebrow" style="color:var(--color-brand)">Supervisión</span>
    <h2 style="font-size:40px;margin:12px 0 10px;color:var(--cmf-navy);font-weight:700">Principales focos del período</h2>
    <hr class="rule" style="background:var(--color-brand);margin-bottom:36px">
    <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:22px;max-width:820px">
      <li style="display:flex;gap:18px;align-items:flex-start"><span style="width:11px;height:11px;border-radius:50%;background:var(--color-brand);margin-top:10px;flex-shrink:0"></span><span style="font-size:23px;line-height:1.4;color:var(--text-body)">Gestión de riesgos operacionales en entidades fiscalizadas</span></li>
      <li style="display:flex;gap:18px;align-items:flex-start"><span style="width:11px;height:11px;border-radius:50%;background:var(--cmf-teal);margin-top:10px;flex-shrink:0"></span><span style="font-size:23px;line-height:1.4;color:var(--text-body)">Transparencia de información al usuario financiero</span></li>
      <li style="display:flex;gap:18px;align-items:flex-start"><span style="width:11px;height:11px;border-radius:50%;background:var(--cmf-navy);margin-top:10px;flex-shrink:0"></span><span style="font-size:23px;line-height:1.4;color:var(--text-body)">Estabilidad del sistema y resguardo de la fe pública</span></li>
    </ul>
  </div>
</section>
</body></html>
