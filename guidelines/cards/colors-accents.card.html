<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-card);padding:18px 20px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-size:11px;font-family:var(--font-mono)}.hex{display:flex;gap:0;margin-top:6px}.hex span{flex:1;font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono);padding:0 8px}</style>
</head><body><div class="sw">
<div style="background:var(--cmf-navy);color:#fff">navy</div>
<div style="background:var(--cmf-indigo);color:#fff">indigo</div>
<div style="background:var(--cmf-teal);color:#fff">teal</div>
<div style="background:var(--cmf-teal-deep);color:#fff">teal-deep</div>
<div style="background:var(--cmf-teal-200);color:#2c2c2b">teal-200</div>

</div>
<div class="hex"><span>#162c55</span><span>#3f3a7e</span><span>#12a095</span><span>#0e6e68</span><span>#97d6d2</span><span>#e4f4f2</span></div>
<p style="margin:14px 0 0;font-size:13px;color:var(--text-muted)">Primera categoría del manual: portadas, cabeceras y bloques diagonales. Teal es el acento secundario (CMF Educa); navy es la superficie institucional oscura.</p></body></html>
