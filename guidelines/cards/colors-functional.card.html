<!-- @dsCard group="Colores" viewport="700x170" name="Funcionales / estado" subtitle="Estados armonizados — éxito, advertencia, error, info" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-card);padding:18px 20px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-size:11px;font-family:var(--font-mono)}.hex{display:flex;gap:0;margin-top:6px}.hex span{flex:1;font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono);padding:0 8px}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:34px;background:var(--cmf-success)"></div><div style="background:var(--cmf-success-bg);padding:8px 10px;font-size:12px;color:#13643f;font-weight:600">Éxito</div></div>
<div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:34px;background:var(--cmf-warning)"></div><div style="background:var(--cmf-warning-bg);padding:8px 10px;font-size:12px;color:#8a5905;font-weight:600">Advertencia</div></div>
<div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:34px;background:var(--cmf-danger)"></div><div style="background:var(--cmf-danger-bg);padding:8px 10px;font-size:12px;color:#922a1f;font-weight:600">Error</div></div>
<div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:34px;background:var(--cmf-info)"></div><div style="background:var(--cmf-info-bg);padding:8px 10px;font-size:12px;color:var(--cmf-navy);font-weight:600">Información</div></div>
</div>
<p style="margin:14px 0 0;font-size:13px;color:var(--text-muted)">No vienen del manual: se armonizaron con la paleta CMF. Cada estado tiene tono pleno (barra/icono) y fondo tintado (superficie).</p></body></html>
