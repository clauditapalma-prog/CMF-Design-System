<!-- @dsCard group="Espaciado" viewport="700x180" name="Radios y elevación" subtitle="Esquinas contenidas; sombras neutras suaves" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-card);padding:18px 20px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-size:11px;font-family:var(--font-mono)}.hex{display:flex;gap:0;margin-top:6px}.hex span{flex:1;font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono);padding:0 8px}</style>
</head><body><div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">
<div style="text-align:center"><div style="width:62px;height:48px;background:var(--cmf-ink-100);border:1px solid var(--border-subtle);border-radius:var(--radius-xs)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px">xs · 3px</div></div><div style="text-align:center"><div style="width:62px;height:48px;background:var(--cmf-ink-100);border:1px solid var(--border-subtle);border-radius:var(--radius-sm)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px">sm · 5px</div></div><div style="text-align:center"><div style="width:62px;height:48px;background:var(--cmf-ink-100);border:1px solid var(--border-subtle);border-radius:var(--radius-md)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px">md · 8px</div></div><div style="text-align:center"><div style="width:62px;height:48px;background:var(--cmf-ink-100);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px">lg · 12px</div></div><div style="text-align:center"><div style="width:62px;height:48px;background:var(--cmf-ink-100);border:1px solid var(--border-subtle);border-radius:var(--radius-pill)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px">pill · 999px</div></div>
<div style="width:1px;height:56px;background:var(--border-subtle)"></div>
<div style="text-align:center"><div style="width:62px;height:48px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px">shadow-xs</div></div><div style="text-align:center"><div style="width:62px;height:48px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px">shadow-sm</div></div><div style="text-align:center"><div style="width:62px;height:48px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px">shadow-md</div></div><div style="text-align:center"><div style="width:62px;height:48px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px">shadow-lg</div></div>
</div>
<p style="margin:16px 0 0;font-size:13px;color:var(--text-muted)">Tarjetas: radio md + shadow sm. Botones y campos: radio sm. Nada más redondeado que 12px, salvo pills.</p></body></html>
