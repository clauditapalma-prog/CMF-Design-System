<!-- @dsCard group="Marca" viewport="700x220" name="Motivo gráfico y regla de acento" subtitle="Bloques diagonales (navy→teal→índigo) y la regla morada" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-card);padding:18px 20px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-size:11px;font-family:var(--font-mono)}.hex{display:flex;gap:0;margin-top:6px}.hex span{flex:1;font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono);padding:0 8px}</style>
</head><body><div style="display:flex;gap:20px;height:180px">
<div style="flex:1.4;position:relative;overflow:hidden;border-radius:var(--radius-md);background:var(--cmf-navy)">
<span style="position:absolute;top:-60px;right:-40px;width:280px;height:180px;background:var(--cmf-indigo);transform:rotate(-38deg);display:block"></span>
<span style="position:absolute;bottom:-70px;right:30px;width:240px;height:160px;background:var(--cmf-teal);transform:rotate(-38deg);display:block"></span>
<span style="position:absolute;top:-20px;bottom:-20px;right:44px;width:6px;background:var(--color-brand);transform:rotate(-38deg);display:block"></span>
<span style="position:absolute;left:18px;bottom:16px;color:#fff;font-size:12px;letter-spacing:var(--ls-caps);text-transform:uppercase;font-weight:700">Portada · bloques diagonales</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px">
<hr class="cmf-rule" style="margin:0">
<p style="margin:0;font-size:13px;color:var(--text-muted);line-height:1.5">Barra de 4–5px, 56–72px de ancho, extremos redondeados, morado de marca. Va bajo el logo y bajo los títulos de sección: es el motivo estructural del sistema.</p>
<hr class="cmf-rule" style="margin:0;background:var(--color-accent);width:72px">
<p style="margin:0;font-size:12px;color:var(--text-faint)">Variante teal para CMF Educa.</p>
</div>
</div></body></html>
